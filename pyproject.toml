[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zodiac-video-local"
version = "0.1.0"
description = "Local Zodiac video production control plane and Remotion runtime"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
local = [
  "faster-whisper>=1,<2",
  "av>=11,<19",
]

[project.scripts]
zodiac = "tools.zodiac_gui:main"
zodiac-control = "tools.control_plane.cli:main"

[tool.setuptools.packages.find]
include = ["tools*"]
