<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vườn Mây · Nhà kính trên cao</title>
<link rel="stylesheet" href="/garden/garden.css">
</head>
<body>
<div id="stage">
  <canvas id="world" width="1080" height="1920"></canvas>
  <header id="top">
    <div class="brand-row"><span class="brand">✦ bungmoto</span><span class="tag">nhà kính chung</span></div>
    <b>Vườn Mây</b>
    <span id="hint"></span>
    <div class="garden-status"><span class="live-dot" aria-hidden="true"></span><span id="audienceCount">Vườn đang mở</span><span id="eventLabel">Chờ người gieo hạt</span></div>
  </header>
  <aside id="scoreboard" aria-label="Bảng xếp hạng phiên LIVE">
    <div class="score-heading"><b>ĐUA PHIÊN</b><span id="sessionLabel">Chờ khách đầu tiên</span></div>
    <ol id="leaders"><li class="empty">Người đầu tiên sẽ mở phiên mới.</li></ol>
  </aside>
  <div id="heartBar" aria-live="off"><span id="heartKind">TIM · CHĂM CÂY</span><span id="heartCount">0/100</span><i id="heartFill"></i></div>
  <div id="shotLabel" aria-live="polite">TOÀN CẢNH VƯỜN</div>
  <section id="eventHero" aria-live="polite" aria-hidden="true">
    <img id="eventArt" alt="">
    <div class="event-copy">
      <span class="event-kicker">SỰ KIỆN TOÀN VƯỜN</span>
      <b id="eventHeroTitle">Sự kiện</b>
      <span id="eventHeroHint"></span>
      <div class="event-meter" aria-hidden="true"><i id="eventMeterFill"></i></div>
      <small id="eventHeroMeta"></small>
    </div>
  </section>
  <section id="focusCard" aria-live="polite" aria-hidden="true">
    <span id="focusKicker">CHẬU ĐANG ĐƯỢC CHÚ Ý</span>
    <b id="focusName">Người làm vườn</b>
    <span id="focusStatus"></span>
    <strong id="focusAction"></strong>
  </section>
  <ul id="feed"></ul>
</div>
<script type="module" src="/garden/garden.js"></script>
</body>
</html>
