name: Zodiac plugin package bridge
on:
  pull_request:
    branches: [main]
    paths:
      - '.plugin-bridge-trigger'
      - 'plugins/zodiac-video-pipeline/**'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin archives
        shell: bash
        run: |
          set -euo pipefail
          SRC="plugins/zodiac-video-pipeline"
          OUT="$RUNNER_TEMP/zodiac-plugin-build"
          VERSION="$(jq -r .version "$SRC/plugin.json")"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          build_split() {
            profile="$1"
            name="$2"
            dest="$OUT/$name"
            mkdir -p "$dest/skills/$name" "$dest/skills/zodiac-video-pipeline" "$dest/.codex-plugin"
            cp "$SRC/package.json" "$SRC/package-lock.json" "$dest/"
            cp -a "$SRC/skills/zodiac-video-pipeline/." "$dest/skills/zodiac-video-pipeline/"
            cp "$SRC/skills/$name/SKILL.md" "$dest/skills/$name/SKILL.md"
            jq --arg v "$VERSION" '{
              "$schema":"https://agent-plugins.org/schemas/1.0.0/plugin.schema.json",
              author:{name:"Personal"},
              description:.description,
              extensions:{"com.openai":{interface:.interface}},
              name:.name,
              version:$v
            }' "$SRC/distributions/$profile.plugin.json" > "$dest/plugin.json"
            jq --arg v "$VERSION" '{
              interface:.interface,
              name:.name,
              version:$v,
              description:.description,
              author:{name:"Personal"},
              keywords:[],
              skills:"./skills"
            }' "$SRC/distributions/$profile.plugin.json" > "$dest/.codex-plugin/plugin.json"
            (cd "$dest" && zip -qr "$OUT/$name-$VERSION.zip" .)
          }

          build_split web zodiac-video-web
          build_split local zodiac-video-local

          mkdir -p "$OUT/zodiac-video-pipeline"
          rsync -a --exclude node_modules --exclude .runtime "$SRC/" "$OUT/zodiac-video-pipeline/"
          (cd "$OUT/zodiac-video-pipeline" && zip -qr "$OUT/zodiac-video-pipeline-$VERSION.zip" .)

          sha256sum "$OUT"/*.zip
      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-video-web
          path: ${{ runner.temp }}/zodiac-plugin-build/zodiac-video-web-*.zip
          if-no-files-found: error
      - name: Upload Local
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-video-local
          path: ${{ runner.temp }}/zodiac-plugin-build/zodiac-video-local-*.zip
          if-no-files-found: error
      - name: Upload Pipeline
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-video-pipeline
          path: ${{ runner.temp }}/zodiac-plugin-build/zodiac-video-pipeline-*.zip
          if-no-files-found: error
