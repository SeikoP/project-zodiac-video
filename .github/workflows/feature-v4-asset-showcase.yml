name: Feature V4 asset showcase

on:
  push:
    branches:
      - codex/zodiac-maintainability-refactor

permissions:
  contents: write

jobs:
  build-showcase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zodiac-maintainability-refactor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install SVG rasterizer and font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin fontconfig
          mkdir -p ~/.local/share/fonts
          cp runtime/zodiac-renderer/2.0.1/renderer/fonts/PatrickHand-Regular.ttf ~/.local/share/fonts/
          fc-cache -f
      - name: Build actual V4 showcase
        run: node tools/preview/build-zodiac-v4-asset-showcase.mjs
      - name: Rasterize showcase
        run: |
          rsvg-convert -w 1080 -h 1920 docs/previews/zodiac-v4-full-asset-showcase.svg -o docs/previews/zodiac-v4-full-asset-showcase.png
          test -s docs/previews/zodiac-v4-full-asset-showcase.svg
          test -s docs/previews/zodiac-v4-full-asset-showcase.png
          file docs/previews/zodiac-v4-full-asset-showcase.png
      - name: Commit preview artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previews/zodiac-v4-full-asset-showcase.svg docs/previews/zodiac-v4-full-asset-showcase.png docs/previews/zodiac-v4-full-asset-showcase.json
          git diff --cached --quiet && exit 0
          git commit -m "preview: render V4 full asset showcase"
          git push origin HEAD:codex/zodiac-maintainability-refactor
