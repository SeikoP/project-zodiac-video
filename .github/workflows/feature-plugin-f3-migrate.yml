name: Feature plugin F3 migrate

on:
  push:
    branches:
      - codex/zodiac-maintainability-refactor

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/zodiac-maintainability-refactor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify F3 migrator syntax
        run: python -m py_compile tools/migrations/plugin-f3-phase-owners.py
      - name: Apply deterministic F3 phase migration
        run: python tools/migrations/plugin-f3-phase-owners.py
      - name: Verify executable architecture
        run: node --test plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/orchestration/tests/executable-architecture.test.mjs
      - name: Verify full plugin suite
        run: node --test plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/orchestration/tests/*.test.mjs plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/references/*.test.mjs
      - name: Verify asset library
        run: node plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/references/asset-library-v4/validation/validate-library.mjs
      - name: Commit verified F3 migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline
          git diff --cached --quiet && exit 0
          git commit -m "refactor(plugin): make orchestration a thin public routing layer"
          git push origin HEAD:codex/zodiac-maintainability-refactor
