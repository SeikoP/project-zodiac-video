name: Feature Qt validation

on:
  push:
    branches:
      - codex/zodiac-maintainability-refactor

permissions:
  contents: read

jobs:
  qt-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt Linux runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install project and test dependencies
        run: python -m pip install -e . pytest
      - name: Run Qt-dependent regressions
        run: >-
          python -m pytest -q
          tests/test_studio_qt.py
          tests/test_studio_qt_usability.py
          tests/test_vieneu_feedback.py
          tests/test_voice_gap_gui_config.py
