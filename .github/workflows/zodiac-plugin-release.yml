name: Zodiac ChatGPT plugin release archive
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - plugins/zodiac-video-pipeline/plugin.json
      - plugins/zodiac-video-pipeline/.codex-plugin/plugin.json
      - plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/orchestration/pipeline-state.template.json
      - tools/release/build_plugin_bundle.py
      - tools/release/build_split_plugin_bundle.py
      - plugins/zodiac-video-pipeline/distributions/**
      - plugins/zodiac-video-pipeline/skills/zodiac-video-web/**
      - plugins/zodiac-video-pipeline/skills/zodiac-video-local/**
      - .github/workflows/zodiac-plugin-release.yml
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release consistency
        run: node plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/core/release/validate-release-consistency.mjs plugins/zodiac-video-pipeline
      - name: Read plugin version
        id: meta
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('plugins/zodiac-video-pipeline/plugin.json','utf8')).version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create hardened plugin archive
        run: |
          python tools/release/build_plugin_bundle.py \
            --repo-root . \
            --output "$RUNNER_TEMP/zodiac-video-pipeline-plugin.zip" \
            --report "$RUNNER_TEMP/candidate-plugin-report.json"
      - name: Build Web and Local distribution archives
        run: |
          python tools/release/build_split_plugin_bundle.py --repo-root . --profile web --output "$RUNNER_TEMP/zodiac-video-web-plugin.zip" --report "$RUNNER_TEMP/web-plugin-report.json"
          python tools/release/build_split_plugin_bundle.py --repo-root . --profile local --output "$RUNNER_TEMP/zodiac-video-local-plugin.zip" --report "$RUNNER_TEMP/local-plugin-report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: zodiac-video-pipeline-plugin-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zodiac-video-pipeline-plugin.zip
            ${{ runner.temp }}/candidate-plugin-report.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: zodiac-video-web-plugin-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zodiac-video-web-plugin.zip
            ${{ runner.temp }}/web-plugin-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Stage Web plugin for direct ChatGPT upload
        run: |
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'zodiac-video-web-direct'
          root.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'zodiac-video-web-plugin.zip') as archive:
              archive.extractall(root)
          assert (root/'.codex-plugin/plugin.json').is_file()
          assert (root/'skills/zodiac-video-web/SKILL.md').is_file()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zodiac-video-web-direct-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/zodiac-video-web-direct/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: zodiac-video-local-plugin-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zodiac-video-local-plugin.zip
            ${{ runner.temp }}/local-plugin-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Stage Pipeline and Local plugins for direct ChatGPT upload
        run: |
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          for name in ('zodiac-video-pipeline','zodiac-video-local'):
              src=tmp/(name+'-plugin.zip')
              dst=tmp/(name+'-direct')
              dst.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(src) as archive:
                  archive.extractall(dst)
              assert (dst/'.codex-plugin/plugin.json').is_file()
              assert (dst/'plugin.json').is_file()
          assert (tmp/'zodiac-video-pipeline-direct/skills/zodiac-video-pipeline/SKILL.md').is_file()
          assert (tmp/'zodiac-video-local-direct/skills/zodiac-video-local/SKILL.md').is_file()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zodiac-video-pipeline-direct-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/zodiac-video-pipeline-direct/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: zodiac-video-local-direct-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/zodiac-video-local-direct/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
