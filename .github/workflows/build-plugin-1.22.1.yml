name: Build plugin 1.22.1 patch

on:
  push:
    branches: [chore/plugin-1.22-narrator-performance]

permissions:
  contents: read

jobs:
  test-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Context isolation tests
        run: node --test tmp/plugin-1.22.1-root/skills/zodiac-video-pipeline/references/context-isolation.test.mjs
      - name: Narrative validator tests
        run: node --test tmp/plugin-1.22.1-root/skills/zodiac-video-pipeline/references/validate-narrative.test.mjs
      - name: Skill path smoke
        shell: bash
        run: |
          test -f tmp/plugin-1.22.1-root/skills/zodiac-video-pipeline/SKILL.md
          grep -q '["../skill.md","../SKILL.md"]' tmp/plugin-1.22.1-root/skills/zodiac-video-pipeline/references/context-isolation.test.mjs
      - name: Upload patch source
        uses: actions/upload-artifact@v4
        with:
          name: plugin-1.22.1-source
          path: tmp/plugin-1.22.1-root/
          include-hidden-files: true
          retention-days: 1
