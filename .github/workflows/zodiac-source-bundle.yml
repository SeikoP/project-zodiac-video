name: Zodiac phase-scoped execution bundle
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Execution phase to package
        required: true
        type: choice
        options:
          - 01-content
          - 02-visual-production
          - 03-handoff
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build phase source (release-bound)
        run: |
          python tools/build_source_bundle.py \
            --phase "${{ inputs.phase }}" \
            --output /tmp/zodiac-execution-source.zip \
            --commit "$GITHUB_SHA" \
            --release-record docs/zodiac-plugin-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: zodiac-execution-source-${{ inputs.phase }}-${{ github.sha }}
          path: /tmp/zodiac-execution-source.zip
          if-no-files-found: error
          retention-days: 14
