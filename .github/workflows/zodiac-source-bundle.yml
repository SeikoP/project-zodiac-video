name: Zodiac phase-scoped execution bundle
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Execution phase to package
        required: true
        type: choice
        options:
          - 01-content
          - 02-visual-production
          - 03-handoff
  push:
    branches:
      - fix/phase02-review-completeness
    paths:
      - ".github/zodiac-phase02-review-refactor-test"
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    env:
      BUNDLE_PHASE: ${{ github.event.inputs.phase || '02-visual-production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build phase source
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python tools/build_source_bundle.py \
              --phase "$BUNDLE_PHASE" \
              --output /tmp/zodiac-execution-source.zip \
              --commit "$GITHUB_SHA" \
              --release-id prepublish-2.4.68-review-refactor
          else
            python tools/build_source_bundle.py \
              --phase "$BUNDLE_PHASE" \
              --output /tmp/zodiac-execution-source.zip \
              --commit "$GITHUB_SHA" \
              --release-record docs/zodiac-plugin-release.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zodiac-execution-source-${{ env.BUNDLE_PHASE }}-${{ github.sha }}
          path: /tmp/zodiac-execution-source.zip
          if-no-files-found: error
          retention-days: 7
