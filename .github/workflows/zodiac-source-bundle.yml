name: Zodiac phase-scoped execution bundle
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Execution phase to package
        required: true
        type: choice
        options:
          - 01-content
          - 02-visual-production
          - 03-handoff
  push:
    branches:
      - ci/phase02-source-2-5-5
    paths:
      - ".github/zodiac-phase02-255-trigger"
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    env:
      BUNDLE_PHASE: ${{ github.event.inputs.phase || '02-visual-production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7bc1af17e3e7cd36f6cef245ee93b49664d3d8b2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build phase source (release-bound)
        run: |
          python tools/build_source_bundle.py \
            --phase "$BUNDLE_PHASE" \
            --output /tmp/zodiac-execution-source.zip \
            --commit "7bc1af17e3e7cd36f6cef245ee93b49664d3d8b2" \
            --release-id "pluginrel_6acd7d0b505081918be9c48c78c0835a"
      - uses: actions/upload-artifact@v4
        with:
          name: zodiac-execution-source-${{ env.BUNDLE_PHASE }}-${{ github.sha }}
          path: /tmp/zodiac-execution-source.zip
          if-no-files-found: error
          retention-days: 14
