name: phase1-voice-first
on:
  pull_request:
    paths:
      - 'plugins/zodiac-video-pipeline/**'
      - 'tests/test_split_plugin_bundle_builder.py'
      - 'tests/test_web_local_handoff_contract.py'
      - 'tests/test_ci_layout.py'
      - '.github/workflows/phase1-voice-first.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase1-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.5.1'
      - name: Install canonical plugin dependencies
        working-directory: plugins/zodiac-video-pipeline
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify creative Phase 1 handoff and Local bootstrap
        run: |
          set -euo pipefail
          base=plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline
          node --test "$base/orchestration/tests/phase1-handoff-export.test.mjs"
          node --test "$base/orchestration/tests/local-phase1-bootstrap.test.mjs"
  phase1-handoff-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify split bundle and local handoff compatibility
        run: python -m unittest tests.test_split_plugin_bundle_builder tests.test_web_local_handoff_contract -v
