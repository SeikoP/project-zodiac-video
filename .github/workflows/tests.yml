name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: unit / python
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt Linux runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install Zodiac and test dependencies
        run: python -m pip install -e . pytest
      - name: Compile Python
        run: python -m compileall -q tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Producer runner simplification parity
        run: python -m pytest tests/test_simplification_package_import.py tests/test_spatial_contract_hash.py -q
      - name: Verify canonical producer contract bundle (no generation in CI)
        run: python tools/contracts/generate_plugin_bundle.py --check
      - name: Architecture and registry regressions
        run: >-
          python -m pytest
          tests/test_application_service.py
          tests/test_runner_modules.py
          tests/test_runtime_registry.py
          tests/test_contract_bundle.py
          tests/test_test_layout.py
          tests/test_ci_layout.py -q
      - name: Verify the GUI launcher
        run: |
          command -v zodiac
          python -c "from tools.zodiac_qt import main; from tools.studio_qt.app import ZodiacQtApp; assert callable(main) and ZodiacQtApp"

  renderer-smoke:
    name: smoke / renderer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/renderer-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer smoke dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck renderer smoke
        run: npm run typecheck
      - name: Render frame-0 font smoke
        run: npm run smoke

  compatibility-runtime:
    name: compatibility / remotion ${{ matrix.runtime-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime-version:
          - "1.14.0"
          - "1.15.0"
          - "1.16.0"
          - "1.17.0"
          - "1.18.0"
          - "1.18.1"
          - "1.19.0"
          - "1.19.1"
          - "1.20.0"
          - "1.21.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install compatibility runtime dependencies
        working-directory: runtime/zodiac-remotion/${{ matrix.runtime-version }}/renderer
        run: npm install --no-audit --no-fund
      - name: Test compatibility runtime
        working-directory: runtime/zodiac-remotion/${{ matrix.runtime-version }}/renderer
        run: npm test
      - name: Typecheck compatibility runtime
        working-directory: runtime/zodiac-remotion/${{ matrix.runtime-version }}/renderer
        run: npm run typecheck
      - name: Verify registered runtime hash
        if: matrix.runtime-version != '1.14.0'
        working-directory: .
        env:
          RUNTIME_VERSION: ${{ matrix.runtime-version }}
        run: |
          HASH=$(python tools/hash_runtime.py "runtime/zodiac-remotion/$RUNTIME_VERSION/renderer" | tail -n 1)
          grep -q "$HASH" "runtime/zodiac-remotion/$RUNTIME_VERSION/runtime-manifest.json"
      - name: Run version-specific golden compatibility fixture
        working-directory: .
        env:
          ZODIAC_E2E_RUNTIME: "1"
          RUNTIME_VERSION: ${{ matrix.runtime-version }}
        run: |
          case "$RUNTIME_VERSION" in
            1.15.0) python -m unittest tests.test_zodiac_local.SemanticRuntimeV315Tests.test_v315_runtime_prepare_golden_thief -v ;;
            1.16.0) python -m unittest tests.test_zodiac_local.PerformanceRuntimeV316Tests.test_v316_runtime_prepare_accepts_local_first_v4_without_handoff_manifest -v ;;
            1.19.1) python -m unittest tests.test_zodiac_local.RuntimeOwnedAnimationV3191Tests.test_v3191_runtime_prepare_materializes_animation_defaults -v ;;
            1.20.0) python -m unittest tests.test_zodiac_local.RuntimeLayerSafetyV3200Tests.test_v3200_runtime_prepare_with_layer_safety -v ;;
            1.21.0) python -m unittest tests.test_zodiac_local.RuntimeV3210StyleContractTests.test_v3210_runtime_prepare_golden_v4_package -v ;;
            *) echo "No version-specific golden fixture for $RUNTIME_VERSION" ;;
          esac


  control-plane-v2-core:
    name: contract / control-plane-v2-core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Zodiac package
        run: python -m pip install -e .
      - name: Test Control Plane v2 core
        run: |
          python -m unittest \
            tests.test_control_plane_contracts \
            tests.test_control_plane_errors \
            tests.test_authoring_ir \
            tests.test_timeline_anchors \
            tests.test_timeline_compiler \
            tests.test_render_plan_validator \
            tests.test_control_plane_cli \
            tests.test_control_plane_scorpio_golden \
            tests.test_scorpio_v2_production_e2e -v
      - name: Build minimal job through headless compiler
        run: zodiac-control build tests/fixtures/control-plane-v2/minimal --output /tmp/render-plan.json
      - name: Verify Scorpio E22 golden regression
        run: python -m unittest tests.test_control_plane_scorpio_golden -v
      - name: Verify Scorpio Studio v2 production scenarios
        run: python -m unittest tests.test_scorpio_v2_production_e2e -v


  renderer-v2-boundary:
    name: integration / renderer-v2-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: runtime/zodiac-renderer/2.0.0/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test renderer 2 prepare boundary
        run: npm test


  renderer-v2-0-1:
    name: integration / renderer-v2-0-1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/zodiac-renderer/2.0.1/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer 2.0.1 dependencies
        run: npm install --no-audit --no-fund
      - name: Probe real pinned Remotion 2.0.1 CLI
        run: node scripts/local-remotion-cli.mjs --check
      - name: Run renderer 2.0.1 regression
        run: npm test
      - name: Typecheck renderer 2.0.1
        run: npm run typecheck
      - name: Render actual cover opening, dissolve and story frames
        run: node scripts/smoke-cover-opening.mjs
      - name: Upload cover opening review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-opening-review-frames
          path: /tmp/cover-opening-smoke-*/*.png
          if-no-files-found: warn

  renderer-v2-frame-progress-smoke:
    name: integration / frame-progress
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Remotion and tqdm
        run: |
          npm install --prefix runtime/zodiac-renderer/2.0.1/renderer --no-audit --no-fund
          python -m pip install "tqdm>=4.66,<5"
      - name: Prepare actual fixture through Renderer 2.0.1
        run: |
          mkdir -p /tmp/zodiac-remotion-progress/.runtime /tmp/zodiac-remotion-progress/assets
          cp -r runtime/zodiac-renderer/2.0.1/renderer/tests/fixtures/songtu/assets/. /tmp/zodiac-remotion-progress/assets/
          cp runtime/zodiac-renderer/2.0.1/renderer/tests/fixtures/songtu/render-plan.json /tmp/zodiac-remotion-progress/.runtime/render-plan.json
          node runtime/zodiac-renderer/2.0.1/renderer/scripts/prepare.mjs /tmp/zodiac-remotion-progress
      - name: E2E pinned CLI MP4 and observed frame counters
        run: python tests/real_remotion_progress_smoke.py /tmp/zodiac-remotion-progress
      - name: Upload actual smoke MP4 for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer201-frame-progress-smoke
          path: /tmp/zodiac-remotion-progress/frame-progress-smoke.mp4
          if-no-files-found: warn

  renderer-v2-smoke:
    name: integration / renderer-v2-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer 2 dependencies
        working-directory: runtime/zodiac-renderer/2.0.0/renderer
        run: npm install --no-audit --no-fund
      - name: Test renderer 2 boundary
        working-directory: runtime/zodiac-renderer/2.0.0/renderer
        run: npm test
      - name: Typecheck renderer 2
        working-directory: runtime/zodiac-renderer/2.0.0/renderer
        run: npm run typecheck
      - name: Prepare Scorpio executable plan
        run: |
          mkdir -p /tmp/zodiac-scorpio-v2/.runtime /tmp/zodiac-scorpio-v2/assets
          cp tests/fixtures/scorpio-two-versions/expected/render-plan.json /tmp/zodiac-scorpio-v2/.runtime/render-plan.json
          cp tests/fixtures/scorpio-two-versions/package/assets/char-scorpio.svg /tmp/zodiac-scorpio-v2/assets/char-scorpio.svg
          node runtime/zodiac-renderer/2.0.0/renderer/scripts/prepare.mjs /tmp/zodiac-scorpio-v2
      - name: Render Scorpio frame smoke
        working-directory: runtime/zodiac-renderer/2.0.0/renderer
        run: |
          npx remotion still src/index.ts ZodiacRenderPlan /tmp/zodiac-scorpio-v2/frame.png --props=/tmp/zodiac-scorpio-v2/.runtime/renderer-v2-props.json --frame=38
          test -s /tmp/zodiac-scorpio-v2/frame.png
      - name: Render Job5 publish cover PNG using actual Remotion
        run: |
          mkdir -p /tmp/zodiac-scorpio-v2/publish
          cp tests/fixtures/scorpio-two-versions/package/publish/publish.json /tmp/zodiac-scorpio-v2/publish/publish.json
          node runtime/zodiac-renderer/2.0.0/renderer/scripts/render-cover.mjs /tmp/zodiac-scorpio-v2 /tmp/zodiac-scorpio-v2/cover.png
          test -s /tmp/zodiac-scorpio-v2/cover.png
          file /tmp/zodiac-scorpio-v2/cover.png | grep -q "1080 x 1920"
      - name: P0 renderer-faithful 3-scene smoke
        run: node runtime/zodiac-renderer/2.0.0/renderer/scripts/smoke-p0.mjs
      - name: Upload P0 smoke frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-caption-layout-smoke
          path: tests/renderer-smoke/out/p0/
          if-no-files-found: warn

  zodiac-plugin-native:
    name: release / plugin-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Native producer and cross-language contract tests
        run: node --test plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/orchestration/tests/*.test.mjs plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/references/*.test.mjs

  plugin-candidate-bundle:
    name: release / candidate-plugin-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify canonical contract bundle
        run: python tools/contracts/generate_plugin_bundle.py --check
      - name: Build deterministic candidate ZIP
        run: |
          python tools/release/build_plugin_bundle.py --repo-root . --output .release/zodiac-plugin-candidate.zip --report .release/plugin-package-inventory.json
          python tools/release/build_plugin_bundle.py --repo-root . --output .release/candidate-rebuilt.zip
          cmp .release/zodiac-plugin-candidate.zip .release/candidate-rebuilt.zip
          rm .release/candidate-rebuilt.zip
          python -m unittest tests.test_plugin_bundle_builder -v
      - uses: actions/upload-artifact@v4
        with:
          name: zodiac-plugin-candidate-unreleased
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
