name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Zodiac TUI package
        run: python -m pip install -e .
      - name: Verify zodiac command
        run: |
          command -v zodiac
          python -c "from tools.tui.app import ZodiacTui; assert ZodiacTui.TITLE == 'Zodiac'"
      - name: Compile Python
        run: python -m compileall -q tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  renderer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/renderer-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer smoke dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck renderer smoke
        run: npm run typecheck
      - name: Render frame-0 font smoke
        run: npm run smoke

  shared-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/zodiac-remotion/1.14.0/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install shared runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Test shared runtime contract
        run: npm test
      - name: Typecheck shared runtime
        run: npm run typecheck

  shared-runtime-1-15:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/zodiac-remotion/1.15.0/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install shared runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Test semantic shared runtime
        run: npm test
      - name: Typecheck semantic shared runtime
        run: npm run typecheck
      - name: Print canonical runtime hash
        working-directory: .
        run: python tools/hash_runtime.py runtime/zodiac-remotion/1.15.0/renderer
      - name: Golden thief package prepare
        working-directory: .
        env:
          ZODIAC_E2E_RUNTIME: "1"
        run: python -m unittest tests.test_zodiac_local.SemanticRuntimeV315Tests.test_v315_runtime_prepare_golden_thief -v

  shared-runtime-1-16:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/zodiac-remotion/1.16.0/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install performance runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Test performance runtime
        run: npm test
      - name: Typecheck performance runtime
        run: npm run typecheck
      - name: Print canonical runtime 1.16 hash
        working-directory: .
        run: python tools/hash_runtime.py runtime/zodiac-remotion/1.16.0/renderer
      - name: Golden performance v4 package prepare
        working-directory: .
        env:
          ZODIAC_E2E_RUNTIME: "1"
        run: python -m unittest tests.test_zodiac_local.PerformanceRuntimeV316Tests.test_v316_runtime_prepare_accepts_local_first_v4_without_handoff_manifest -v


  shared-runtime-1-17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/zodiac-remotion/1.17.0/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install cover-safe runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Test cover-safe runtime
        run: npm test
      - name: Typecheck cover-safe runtime
        run: npm run typecheck
      - name: Verify canonical runtime 1.17 hash
        working-directory: .
        run: |
          HASH=$(python tools/hash_runtime.py runtime/zodiac-remotion/1.17.0/renderer | tail -n 1)
          grep -q "$HASH" runtime/zodiac-remotion/1.17.0/runtime-manifest.json


  shared-runtime-1-18:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/zodiac-remotion/1.18.0/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime-owned animation dependencies
        run: npm install --no-audit --no-fund
      - name: Test runtime-owned animation
        run: npm test
      - name: Typecheck runtime-owned animation
        run: npm run typecheck
      - name: Verify canonical runtime 1.18 hash
        working-directory: .
        run: |
          HASH=$(python tools/hash_runtime.py runtime/zodiac-remotion/1.18.0/renderer | tail -n 1)
          grep -q "$HASH" runtime/zodiac-remotion/1.18.0/runtime-manifest.json


  shared-runtime-1-18-1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/zodiac-remotion/1.18.1/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install corrected runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Test corrected runtime
        run: npm test
      - name: Typecheck corrected runtime
        run: npm run typecheck
      - name: Print canonical runtime 1.18.1 hash
        working-directory: .
        run: python tools/hash_runtime.py runtime/zodiac-remotion/1.18.1/renderer
