name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: unit / python
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt Linux runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer 2.0.1 dependencies
        run: npm install --prefix runtime/zodiac-renderer/2.0.1/renderer --no-audit --no-fund
      - name: Install Zodiac and test dependencies
        run: python -m pip install -e . pytest
      - name: Compile Python
        run: python -m compileall -q tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Producer runner simplification parity
        run: python -m pytest tests/test_simplification_package_import.py tests/test_spatial_contract_hash.py -q
      - name: Verify canonical producer contract bundle (no generation in CI)
        run: python tools/contracts/generate_plugin_bundle.py --check
      - name: Architecture and registry regressions
        run: >-
          python -m pytest
          tests/test_application_service.py
          tests/test_runner_modules.py
          tests/test_runtime_registry.py
          tests/test_contract_bundle.py
          tests/test_ci_layout.py -q
      - name: Verify the GUI launcher
        run: |
          command -v zodiac
          python -c "from tools.zodiac_qt import main; from tools.studio_qt.app import ZodiacQtApp; assert callable(main) and ZodiacQtApp"

  renderer-smoke:
    name: smoke / renderer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/renderer-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer smoke dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck renderer smoke
        run: npm run typecheck
      - name: Render frame-0 font smoke
        run: npm run smoke

  control-plane-v2-core:
    name: contract / control-plane-v2-core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Zodiac package
        run: python -m pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer 2.0.1 dependencies
        run: npm install --prefix runtime/zodiac-renderer/2.0.1/renderer --no-audit --no-fund
      - name: Test Control Plane v2 core
        run: |
          python -m unittest \
            tests.test_control_plane_contracts \
            tests.test_control_plane_errors \
            tests.test_authoring_ir \
            tests.test_timeline_anchors \
            tests.test_timeline_compiler \
            tests.test_render_plan_validator \
            tests.test_control_plane_cli \
            tests.test_control_plane_scorpio_golden \
            tests.test_scorpio_v2_production_e2e -v
      - name: Build minimal job through headless compiler
        run: zodiac-control build tests/fixtures/control-plane-v2/minimal --output /tmp/render-plan.json
      - name: Verify Scorpio E22 golden regression
        run: python -m unittest tests.test_control_plane_scorpio_golden -v
      - name: Verify Scorpio Studio v2 production scenarios
        run: python -m unittest tests.test_scorpio_v2_production_e2e -v


  renderer-v2-0-2:
    name: integration / renderer-v2-0-2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/zodiac-renderer/2.0.2/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer 2.0.2 dependencies
        run: npm install --no-audit --no-fund
      - name: Probe real pinned Remotion CLI
        run: node scripts/local-remotion-cli.mjs --check
      - name: Run renderer 2.0.2 regression
        run: npm test
      - name: Typecheck renderer 2.0.2
        run: npm run typecheck

  renderer-v2-0-1:
    name: integration / renderer-v2-0-1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/zodiac-renderer/2.0.1/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer 2.0.1 dependencies
        run: npm install --no-audit --no-fund
      - name: Probe real pinned Remotion 2.0.1 CLI
        run: node scripts/local-remotion-cli.mjs --check
      - name: Run renderer 2.0.1 regression
        run: npm test
      - name: Typecheck renderer 2.0.1
        run: npm run typecheck
      - name: Render actual cover opening, dissolve and story frames
        run: node scripts/smoke-cover-opening.mjs
      - name: Upload cover opening review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-opening-review-frames
          path: /tmp/cover-opening-smoke-*/*.png
          if-no-files-found: warn

  renderer-v2-frame-progress-smoke:
    name: integration / frame-progress
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Remotion and tqdm
        run: |
          npm install --prefix runtime/zodiac-renderer/2.0.1/renderer --no-audit --no-fund
          python -m pip install "tqdm>=4.66,<5"
      - name: Prepare actual fixture through Renderer 2.0.1
        run: |
          mkdir -p /tmp/zodiac-remotion-progress/.runtime /tmp/zodiac-remotion-progress/assets
          cp -r runtime/zodiac-renderer/2.0.1/renderer/tests/fixtures/songtu/assets/. /tmp/zodiac-remotion-progress/assets/
          cp runtime/zodiac-renderer/2.0.1/renderer/tests/fixtures/songtu/render-plan.json /tmp/zodiac-remotion-progress/.runtime/render-plan.json
          node runtime/zodiac-renderer/2.0.1/renderer/scripts/prepare.mjs /tmp/zodiac-remotion-progress
      - name: E2E pinned CLI MP4 and observed frame counters
        run: python tests/real_remotion_progress_smoke.py /tmp/zodiac-remotion-progress
      - name: Upload actual smoke MP4 for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer201-frame-progress-smoke
          path: /tmp/zodiac-remotion-progress/frame-progress-smoke.mp4
          if-no-files-found: warn

  zodiac-plugin-native:
    name: release / plugin-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Native producer and cross-language contract tests
        run: node --test plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/orchestration/tests/*.test.mjs plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/references/*.test.mjs

  plugin-candidate-bundle:
    name: release / candidate-plugin-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify canonical contract bundle
        run: python tools/contracts/generate_plugin_bundle.py --check
      - name: Build deterministic candidate ZIP
        run: |
          python tools/release/build_plugin_bundle.py --repo-root . --output .release/zodiac-plugin-candidate.zip --report .release/plugin-package-inventory.json
          python tools/release/build_plugin_bundle.py --repo-root . --output .release/candidate-rebuilt.zip
          cmp .release/zodiac-plugin-candidate.zip .release/candidate-rebuilt.zip
          rm .release/candidate-rebuilt.zip
          python -m unittest tests.test_plugin_bundle_builder -v
      - uses: actions/upload-artifact@v4
        with:
          name: zodiac-plugin-candidate-unreleased
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  livestream-pk:
    name: integration / livestream-pk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/livestream-pk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install livestream tool dependencies
        run: npm ci --no-audit --no-fund
      - name: Run livestream unit and simulator tests
        run: npm test
      - name: Run isolated end-to-end smoke test
        run: npm run smoke
