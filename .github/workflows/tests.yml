name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  renderer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/renderer-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer smoke dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck renderer smoke
        run: npm run typecheck
      - name: Render frame-0 font smoke
        run: npm run smoke

  shared-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/zodiac-remotion/1.14.0/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install shared runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Test shared runtime contract
        run: npm test
      - name: Typecheck shared runtime
        run: npm run typecheck

  shared-runtime-1-15:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime/zodiac-remotion/1.15.0/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install shared runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Test semantic shared runtime
        run: npm test
      - name: Typecheck semantic shared runtime
        run: npm run typecheck
      - name: Print canonical runtime hash
        working-directory: .
        run: python tools/hash_runtime.py runtime/zodiac-remotion/1.15.0/renderer
