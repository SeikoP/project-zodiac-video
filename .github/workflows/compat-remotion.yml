name: compat-remotion

# Old Remotion 1.x runtimes only matter to the legacy v1 package path. Re-test them
# when that path (or the runtimes) change, on main, or on demand -- not on every PR.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "runtime/zodiac-remotion/**"
      - "runtime/releases/zodiac-remotion.json"
      - "tools/zodiac_local.py"
      - "tools/hash_runtime.py"
      - "tests/zodiac_local_cases/**"
      - "tests/test_zodiac_local.py"
      - ".github/workflows/compat-remotion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-runtime:
    name: compatibility / remotion ${{ matrix.runtime-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime-version:
          - "1.14.0"
          - "1.15.0"
          - "1.16.0"
          - "1.17.0"
          - "1.18.0"
          - "1.18.1"
          - "1.19.0"
          - "1.19.1"
          - "1.20.0"
          - "1.21.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install compatibility runtime dependencies
        working-directory: runtime/zodiac-remotion/${{ matrix.runtime-version }}/renderer
        run: npm install --no-audit --no-fund
      - name: Test compatibility runtime
        working-directory: runtime/zodiac-remotion/${{ matrix.runtime-version }}/renderer
        run: npm test
      - name: Typecheck compatibility runtime
        working-directory: runtime/zodiac-remotion/${{ matrix.runtime-version }}/renderer
        run: npm run typecheck
      - name: Verify registered runtime hash
        if: matrix.runtime-version != '1.14.0'
        working-directory: .
        env:
          RUNTIME_VERSION: ${{ matrix.runtime-version }}
        run: |
          HASH=$(python tools/hash_runtime.py "runtime/zodiac-remotion/$RUNTIME_VERSION/renderer" | tail -n 1)
          grep -q "$HASH" "runtime/zodiac-remotion/$RUNTIME_VERSION/runtime-manifest.json"
      - name: Run version-specific golden compatibility fixture
        working-directory: .
        env:
          ZODIAC_E2E_RUNTIME: "1"
          RUNTIME_VERSION: ${{ matrix.runtime-version }}
        run: |
          case "$RUNTIME_VERSION" in
            1.15.0) python -m unittest tests.test_zodiac_local.SemanticRuntimeV315Tests.test_v315_runtime_prepare_golden_thief -v ;;
            1.16.0) python -m unittest tests.test_zodiac_local.PerformanceRuntimeV316Tests.test_v316_runtime_prepare_accepts_local_first_v4_without_handoff_manifest -v ;;
            1.19.1) python -m unittest tests.test_zodiac_local.RuntimeOwnedAnimationV3191Tests.test_v3191_runtime_prepare_materializes_animation_defaults -v ;;
            1.20.0) python -m unittest tests.test_zodiac_local.RuntimeLayerSafetyV3200Tests.test_v3200_runtime_prepare_with_layer_safety -v ;;
            1.21.0) python -m unittest tests.test_zodiac_local.RuntimeV3210StyleContractTests.test_v3210_runtime_prepare_golden_v4_package -v ;;
            *) echo "No version-specific golden fixture for $RUNTIME_VERSION" ;;
          esac
