name: Build plugin 1.20 overlay

on:
  push:
    branches: [feat/runtime-1.15-semantic-interaction]

permissions:
  contents: read

jobs:
  build-plugin-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin overlay archive
        shell: bash
        run: |
          test -f tmp/plugin-1.20-root/plugin.json
          tar -C tmp/plugin-1.20-root -czf plugin-1.20-overlay.tar.gz .
      - name: Upload plugin overlay
        uses: actions/upload-artifact@v4
        with:
          name: plugin-1.20-overlay
          path: plugin-1.20-overlay.tar.gz
          retention-days: 1
