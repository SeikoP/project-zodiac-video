name: Feature post-refactor audit

on:
  push:
    branches:
      - codex/zodiac-maintainability-refactor

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run post-refactor regression tests
        run: node --test plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/orchestration/tests/post-refactor-audit.test.mjs
      - name: Run full plugin suite
        run: node --test plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/orchestration/tests/*.test.mjs plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/references/*.test.mjs
      - name: Validate V4 asset library
        run: node plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/references/asset-library-v4/validation/validate-library.mjs
      - name: Measure fresh visual-compile context
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {loadStepContext} from './plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/orchestration/plan-step-context.mjs';
          import {readFile} from 'node:fs/promises';
          const root='./plugins/zodiac-video-pipeline/skills/zodiac-video-pipeline/orchestration';
          const state=JSON.parse(await readFile(root+'/pipeline-state.template.json','utf8'));
          const result=await loadStepContext('02-visual-production','visual_compile',state.flags);
          const rows=(result.context_manifest??[]).filter(row=>row.bytes).sort((a,b)=>b.bytes-a.bytes);
          console.log(JSON.stringify({
            refs:result.required_references.length,
            bytes:rows.reduce((sum,row)=>sum+row.bytes,0),
            selected_capabilities:result.selected_capabilities,
            top_refs:rows.slice(0,10).map(row=>({path:row.path,bytes:row.bytes}))
          },null,2));
          NODE
