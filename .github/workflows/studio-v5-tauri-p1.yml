name: Zodiac Studio V5 P1 Windows host

on:
  push:
    branches:
      - experiment/studio-v5-p1-20261114
  pull_request:
    paths:
      - "apps/zodiac-studio/**"
      - "tools/studio_project/**"
      - "tests/test_studio_p1_*.py"
      - ".github/workflows/studio-v5-tauri-p1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tauri-windows:
    name: Tauri shell, Python RPC and native build
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/zodiac-studio/src-tauri -> target
      - name: Install legacy Studio V2 test dependency
        shell: pwsh
        run: python -m pip install "tqdm>=4.66,<5"
      - name: Python P0/P1 contracts and integration
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_studio_project_*.py' -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_studio_p1_*.py' -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_job5_historical_contract.py' -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frontend dependencies (locked)
        working-directory: apps/zodiac-studio
        run: npm ci --no-audit --no-fund
      - name: React TypeScript + Vite build
        working-directory: apps/zodiac-studio
        run: npm run build
      - name: Rust typecheck (locked)
        working-directory: apps/zodiac-studio/src-tauri
        run: cargo check --locked
      - name: Rust host tests (locked)
        working-directory: apps/zodiac-studio/src-tauri
        run: cargo test --locked
      - name: Tauri Windows executable (debug, no release bundle)
        working-directory: apps/zodiac-studio
        run: npx tauri build --debug --no-bundle
