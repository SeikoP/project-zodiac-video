[package]
name = "zodiac-studio-v5"
version = "0.1.0"
description = "Experimental Zodiac Studio single-window Tauri host"
authors = ["Zodiac Studio contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zodiac_studio_v5_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
