<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ma Kết — so sánh hai bản 10 giây</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1b2027;color:#eef0f2;font:15px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;align-items:center;padding:16px;gap:10px}
h1{font-size:20px;margin:0}p{margin:0;color:#c0c6ce;text-align:center}.videos{display:flex;gap:24px;flex:1;min-height:0;justify-content:center;width:100%}figure{margin:0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}figcaption{font-size:17px;font-weight:650}video{min-height:0;max-width:100%;height:100%;aspect-ratio:9/16;background:#0c0f13;border-radius:5px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}button,select{font:inherit;padding:9px 14px;border:1px solid #707c8c;border-radius:6px;background:#2b3542;color:white;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffd66e;outline-offset:3px}#play{background:#f0cf6a;color:#1b2027;border-color:#f0cf6a;font-weight:700}input[type=range]{width:min(360px,45vw)}output{font-variant-numeric:tabular-nums;min-width:90px}#status{font-size:13px;min-height:18px}
</style></head><body>
<h1>Ma Kết — Người thừa · cùng đoạn 10 giây</h1>
<p>Hai bản dùng cùng nội dung, âm thanh và tài nguyên. Khác cách chuyển khung hình.</p>
<div class="videos">
<figure><figcaption>A · Vox sửa — cắt cận theo câu nói</figcaption><video id="a" src="assets/vox.mp4" playsinline preload="auto" aria-label="Bản Vox đã sửa"></video></figure>
<figure><figcaption>B · Diễn xuất — khung rộng, chuyển nhẹ</figcaption><video id="b" src="assets/acting.mp4" playsinline preload="auto" muted aria-label="Bản diễn xuất"></video></figure>
</div>
<div class="controls"><button id="play">Phát cả hai</button><button id="pause">Tạm dừng</button><button id="restart">Xem lại từ đầu</button><label for="sound">Nghe tiếng:</label><select id="sound"><option value="a">Bản A</option><option value="b">Bản B</option><option value="none">Tắt tiếng</option></select></div>
<div class="controls"><label for="seek">Vị trí</label><input id="seek" type="range" min="0" max="10" step="0.01" value="0"><output id="time">0.0 / 10.0s</output></div>
<p id="status" role="status">Đang tải hai video…</p>
<script>
const a=document.querySelector('#a'),b=document.querySelector('#b'),videos=[a,b],seek=document.querySelector('#seek'),status=document.querySelector('#status');
const ready=Promise.all(videos.map(v=>new Promise((resolve,reject)=>{v.addEventListener('loadeddata',resolve,{once:true});v.addEventListener('error',()=>reject(new Error('Không tải được '+v.getAttribute('src'))),{once:true});if(v.readyState>=2)resolve();})));
ready.then(()=>status.textContent='Đã sẵn sàng. Chỉ một bản phát tiếng để tránh âm thanh chồng nhau.').catch(e=>status.textContent=e.message);
function sound(){const selected=document.querySelector('#sound').value;a.muted=selected!=='a';b.muted=selected!=='b';}
async function play(){try{await ready;if(a.ended||a.currentTime>=9.95)a.currentTime=0;b.currentTime=a.currentTime;await Promise.all(videos.map(v=>v.play()));status.textContent='Đang phát đồng thời.';}catch(e){videos.forEach(v=>v.pause());status.textContent='Không phát được video: '+e.message;}}
document.querySelector('#play').onclick=play;
document.querySelector('#pause').onclick=()=>{videos.forEach(v=>v.pause());status.textContent='Đã tạm dừng.';};
document.querySelector('#restart').onclick=()=>{videos.forEach(v=>v.currentTime=0);play();};
document.querySelector('#sound').onchange=sound;
seek.oninput=()=>{videos.forEach(v=>v.currentTime=Number(seek.value));};
a.ontimeupdate=()=>{seek.value=a.currentTime;document.querySelector('#time').value=a.currentTime.toFixed(1)+' / 10.0s';if(!a.paused&&!b.paused&&Math.abs(a.currentTime-b.currentTime)>.12)b.currentTime=a.currentTime;};
a.onended=()=>{videos.forEach(v=>v.pause());status.textContent='Hết 10 giây. Bấm “Xem lại từ đầu” để so sánh tiếp.';};
sound();
</script></body></html>
